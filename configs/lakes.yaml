# Lake register — the ONLY place a lake is defined.
# Adding a lake is adding a row here. The pipeline never hard-codes a lake.
#
# seed_lat / seed_lon are APPROXIMATE search seeds. On first run the pipeline
# snaps each lake to the nearest OpenStreetMap water polygon whose name matches
# `osm_name_regex` within `search_radius_m`, and records what it found.
# `seed_verified: false` means nobody has yet confirmed the seed on a map — do
# that before trusting any output for the lake.
#
# notification_status: final | preliminary | none | unknown   (from lakes.hmda.gov.in)
# dispute: true when the boundary is the subject of live litigation / contempt.
#
# buffer widths follow the Telangana rule-book explainer (verify against the GO):
#   area >= 10 ha  -> 30 m
#   area <  10 ha  ->  9 m

buffer_rule:
  large_threshold_ha: 10
  large_buffer_m: 30
  small_buffer_m: 9

lakes:
  - id: nalla_cheruvu_kukatpally
    name: Nalla Cheruvu (Kukatpally)
    district: Medchal-Malkajgiri
    seed_lat: 17.48836        # centroid of OSM way 129532522 "Nalla Cheruvu" (15.2 ac); old seed 17.4935,78.4005 was ~1.9 km west
    seed_lon: 78.41837
    seed_verified: false
    osm_name_regex: "(?i)nalla.?cheruvu"
    search_radius_m: 2500
    notification_status: unknown
    dispute: false
    notes: "HYDRAA field finding Sep 2024: 27 acres total, 14 acres encroached. Best single lake for validating our area number."

